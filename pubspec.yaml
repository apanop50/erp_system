name: erp_system
description: "Marivio ERP - Professional Enterprise Resource Planning System for Packaging Products"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Database & Caching (Offline Support)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path_provider_android: 2.2.23
  path: ^1.9.0
  flutter_cache_manager: ^3.4.1

  # Firebase Core
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.6
  firebase_crashlytics: ^4.2.0
  firebase_analytics: ^11.4.0
  firebase_remote_config: ^5.2.0
  firebase_app_check: ^0.3.2

  # PDF & Printing
  pdf: ^3.11.2
  printing: ^5.13.4

  # Excel Export
  excel: ^4.0.6

  # Charts
  fl_chart: ^0.69.2

  # QR & Barcode
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.1

  # Localization & Internationalization
  intl: ^0.20.2

  # Utils
  uuid: ^4.5.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.4
  connectivity_plus: ^6.1.1
  internet_connection_checker: ^3.0.0
  timezone: ^0.9.4
  collection: ^1.18.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  logger: ^2.5.0
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/